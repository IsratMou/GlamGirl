<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" viewBox="0 0 700 700">
  <rect width="700" height="700" fill="#f8f0f4"/>
  <rect x="200" y="200" width="300" height="300" rx="24" fill="#f0d9e5" stroke="#d4a0ba" stroke-width="3"/>
  <!-- Image icon frame -->
  <rect x="230" y="230" width="240" height="180" rx="12" fill="#e8c5d6"/>
  <!-- Mountain shape inside -->
  <polygon points="270,380 350,290 430,380" fill="#c4889e"/>
  <polygon points="320,380 390,310 460,380" fill="#b87094"/>
  <!-- Sun circle -->
  <circle cx="420" cy="275" r="28" fill="#f5c4d8"/>
  <!-- Camera lens circle -->
  <circle cx="350" cy="460" r="38" fill="#e8c5d6" stroke="#c4889e" stroke-width="3"/>
  <circle cx="350" cy="460" r="22" fill="#d4a0ba"/>
  <!-- No Image text -->
  <text x="350" y="560" font-family="Arial, sans-serif" font-size="28" fill="#b87094" text-anchor="middle" font-weight="600">No Image</text>
</svg>
